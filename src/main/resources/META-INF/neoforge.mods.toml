[[mods]]
modId="mianbao_blockguard"
version="1.0.0"
displayName="Mianbao BlockGuard"
authors="CN-YiMin"
description='''
Disables block destruction caused by Mianbao's NewModernWarfare (mianbaos_modernwarfare).

All interception happens on discrete game events (explosion finalisation, a direct
destroyBlock call, a nuclear wave being enqueued, or a fire block being placed).
There is no per-tick scan, and ordinary block updates pay only one
non-fire type check (disable with protectFire=false).
'''

