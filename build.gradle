plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = '1.0.0'
group = 'dev.freightera.mianbaoguard'

base {
    archivesName = 'mianbao_blockguard'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.248'

    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        mianbao_blockguard {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}



// Dev-run helper: a pack jar can be put in libs/ and loaded only when this
// property is passed (gradlew runServer -PwithTarget). It is never bundled.
if (project.hasProperty('withTarget')) {
    dependencies {
        runtimeOnly files('libs/mianbaos_modernwarfare-2.7.0.jar')
        runtimeOnly files('libs/geckolib-neoforge-1.21.1-4.9.3.jar')
    }
}
